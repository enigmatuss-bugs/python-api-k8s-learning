replicaCount: 3

image:
  repository: python-api
  tag: v3
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 5000

config:
  APP_ENV: development
  LOG_LEVEL: INFO

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

secretName: python-api-secret
