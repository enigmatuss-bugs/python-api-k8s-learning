apiVersion: batch/v1
kind: Job
metadata:
  name: python-batch-job
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: python-batch
          image: python-batch:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: JOB_NAME
              value: "manual-batch"
      restartPolicy: Never
