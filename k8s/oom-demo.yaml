apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
    - name: memory-app
      image: python:3.12-alpine
      command:
        - python
        - -u
        - -c
        - |
          import time

          data = []

          while True:
              data.append(bytearray(10 * 1024 * 1024))
              print(f"Allocated {len(data) * 10} MiB")
              time.sleep(0.5)
      resources:
        requests:
          memory: "32Mi"
        limits:
          memory: "64Mi"
  restartPolicy: Always
